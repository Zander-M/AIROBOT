services:
  ros2:
    image: ros2_airobot
    container_name: ros2-airobot
    network_mode: host
    init: true

    user: "ros"
    working_dir: /home/ros/ros_ws

    volumes:
      - ./ros_ws:/home/ros/ros_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - HOME=/home/ros
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}

    stdin_open: true
    tty: true
